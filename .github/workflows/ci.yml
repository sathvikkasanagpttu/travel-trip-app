name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-and-build:
    name: Test & Build (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Client Vitest Suite
        run: npm test --workspace=client

      - name: Prepare Server Database Schema
        run: |
          npm --prefix server run prisma:generate
          npm --prefix server run prisma:push

      - name: Run Server Integration Suite
        run: npm test --workspace=server

      - name: Build Client Production Bundle
        run: npm run build --workspace=client

  docker-smoke-test:
    name: Docker Build Smoke Test
    runs-on: ubuntu-latest
    needs: test-and-build

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Server Container Image
        uses: docker/build-push-action@v5
        with:
          context: ./server
          file: ./server/Dockerfile
          push: false
          tags: travel-trip-server:smoke-test

      - name: Build Client Container Image
        uses: docker/build-push-action@v5
        with:
          context: ./client
          file: ./client/Dockerfile
          push: false
          tags: travel-trip-client:smoke-test
